name: Validate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Skip these checks while we're still pre-1.0:
          #   brands       — PR to home-assistant/brands is deferred
          #                  (logos generated under ../brands-pr/, will
          #                  submit later).
          #   topics       — repo topics are managed via the GitHub UI;
          #                  skipping keeps CI green if they're ever
          #                  removed by accident.
          #   description  — same story as topics, the About blurb is set
          #                  via the GitHub UI on the repo page.
          ignore: "brands topics description"
